<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice">
  <!-- XDesk's built-in Ubuntu: the wallpaper (xdesk-look.sh). XDesk's near black, its blue accent as a soft light. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10141b"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#3d7ef5" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#3d7ef5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3d7ef5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#7fabfa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7fabfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#base)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>
  <rect width="3840" height="2160" fill="url(#glow2)"/>
</svg>
