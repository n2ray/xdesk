name: Built-in Linux packages

# XDesk's own packages for its built-in Ubuntu (linux/packages: xdesk-core), tested in a fresh ubuntu:26.04 (new and
# from an old image), and an unsigned repository made from them, as an artifact. The published repository (with
# xdesk-mesa, signed) is n2ray/xdesk-apt's: its Publish workflow builds from this tree.
on:
  workflow_dispatch:
  push:
    branches: [builtin-linux]
    paths: ['linux/packages/**', 'linux/chrome-zink/**', 'linux/xfwm4/**', 'linux/build-debs.sh', 'linux/make-repo.sh', 'linux/test-xdesk-core.sh', '.github/workflows/linux-apt.yml']

jobs:
  packages:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Build
      run: |
        docker run --rm --platform linux/arm64 -v "$PWD:/src" ubuntu:26.04 sh -c '
          apt-get update -q && apt-get install -y -q --no-install-recommends ca-certificates curl gnupg >/dev/null &&
          sh /src/linux/build-debs.sh /src/debs'
        ls -la debs
    - name: Test, new system
      run: docker run --rm --platform linux/arm64 -v "$PWD:/src:ro" ubuntu:26.04 sh /src/linux/test-xdesk-core.sh /src/debs
    - name: Test, system from an old image
      run: docker run --rm --platform linux/arm64 -v "$PWD:/src:ro" ubuntu:26.04 sh /src/linux/test-xdesk-core.sh /src/debs old
    - name: Ubuntu's xfwm4 against XDesk's
      run: docker run --rm --platform linux/arm64 -v "$PWD:/src:ro" ubuntu:26.04 sh -c 'apt-get update -q >/dev/null && sh /src/linux/xfwm4/check-ubuntu.sh /src/debs'
    - name: Repository
      run: |
        docker run --rm --platform linux/arm64 -v "$PWD:/src" ubuntu:26.04 sh -c '
          apt-get update -q && apt-get install -y -q --no-install-recommends apt-utils gnupg >/dev/null &&
          sh /src/linux/make-repo.sh /src/debs /src/repo'
        find repo -type f | sort
    - uses: actions/upload-artifact@v7
      with:
        name: xdesk-apt
        path: repo
        retention-days: 14
