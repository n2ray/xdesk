name: Release

# Push a tag such as v0.2.0 to build and publish. Versions below 1.0 are marked as pre-releases.
# Run it by hand (workflow_dispatch) to build the same signed release files as an artifact without publishing,
# to test them on a phone before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.2.0'
        required: true
        default: '0.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1
    - uses: gradle/actions/wrapper-validation@v6.4.1
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Fetch submodules
      run: git submodule update --init --recursive --jobs 8 --depth 1
    - name: Version
      env:
        TAG: ${{ github.ref_name }}
        INPUT: ${{ inputs.version }}
      run: |
        if [ "${{ github.event_name }}" = push ]; then V="${TAG#v}"; else V="$INPUT"; fi
        echo "VERSION=$V" >> "$GITHUB_ENV"
    - name: Release key
      env:
        KEYSTORE_B64: ${{ secrets.XDESK_KEYSTORE_B64 }}
      run: |
        [ -n "$KEYSTORE_B64" ] || { echo "The XDESK_KEYSTORE_B64 secret is missing: refusing to build a release"; exit 1; }
        echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xdesk-release.jks"
        echo "XDESK_KEYSTORE=$RUNNER_TEMP/xdesk-release.jks" >> "$GITHUB_ENV"
    - name: Build
      env:
        XDESK_KEYSTORE_PASSWORD: ${{ secrets.XDESK_KEYSTORE_PASSWORD }}
        XDESK_KEY_ALIAS: ${{ secrets.XDESK_KEY_ALIAS }}
      run: ./gradlew -PxdeskVersion="$VERSION" assembleStandaloneRelease :receiver:assembleRelease :shell-loader:buildCompanionPackage
    - name: Collect release files
      run: |
        mkdir out
        cp lorie-app/build/outputs/apk/standalone/release/termux-x11-universal-release.apk out/xdesk.apk
        cp receiver/build/outputs/apk/release/receiver-release.apk out/xdesk-receiver.apk
        dpkg-deb -x shell-loader/build/outputs/companion/termux-x11-*-all.deb deb
        cp "$(find deb -name loader.apk)" out/loader.apk
        cp xdesk/xdesk out/xdesk
        (cd out && sha256sum xdesk.apk xdesk-receiver.apk loader.apk xdesk > SHA256SUMS)
        rm -f "$XDESK_KEYSTORE"
    - name: Upload (manual runs)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        name: xdesk-release-${{ env.VERSION }}
        path: out/
    - name: Publish
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        # Full releases by default; a tag with a suffix such as v0.3.0-rc1 is a pre-release
        case "$TAG" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
        gh release create "$TAG" $PRE --title "XDesk $TAG" --generate-notes \
          out/xdesk.apk out/xdesk-receiver.apk out/loader.apk out/xdesk out/SHA256SUMS
