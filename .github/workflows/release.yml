name: xdesx signed APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.2.0'
        required: true
        default: '0.8.0-xdesx.32'
      publish:
        type: boolean
        default: false
        description: Publish this APK in the configured xdesx distribution repository

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1
    - uses: gradle/actions/wrapper-validation@v6.4.1
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Fetch submodules
      run: git submodule update --init --recursive --jobs 8 --depth 1
    # Protocol v3 service paired with the built-in image.
    - uses: actions/checkout@v7
      with:
        repository: n2ray/termux-va
        ref: faf10039dfc41756d16139926d323374811a322a
        path: build/termux-va-src
        persist-credentials: false
    - name: Build the MediaCodec service for the built-in Linux
      run: |
        src=build/termux-va-src
        cc="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
        "$cc" -std=c11 -O2 -fPIE -pie -Wl,-z,max-page-size=16384 -I"$src/common" "$src/daemon/termux-va.c" \
          -o lorie-app/src/main/jniLibs/arm64-v8a/libtermux_va.so -lmediandk -llog -landroid
    - name: Version
      env:
        INPUT: ${{ inputs.version }}
      run: |
        [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
        echo "VERSION=$INPUT" >> "$GITHUB_ENV"
    - name: Release key
      env:
        KEYSTORE_B64: ${{ secrets.XDESK_KEYSTORE_B64 }}
      run: |
        [ -n "$KEYSTORE_B64" ] || { echo "The XDESK_KEYSTORE_B64 secret is missing: refusing to build a release"; exit 1; }
        echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xdesk-release.jks"
        echo "XDESK_KEYSTORE=$RUNNER_TEMP/xdesk-release.jks" >> "$GITHUB_ENV"
    - name: Install decoration rasterizer
      run: python3 -c "from PIL import Image" || python3 -m pip install Pillow==11.3.0
    - name: Build
      env:
        XDESK_KEYSTORE_PASSWORD: ${{ secrets.XDESK_KEYSTORE_PASSWORD }}
        XDESK_KEY_ALIAS: ${{ secrets.XDESK_KEY_ALIAS }}
      # :input-core:test runs the shared gesture table (input-core/src/test/resources/gestures.json). In this step because
      # configuring the other projects needs its version and key settings.
      run: ./gradlew -PxdeskVersion="$VERSION" :input-core:test :lorie-app:assembleStandaloneRelease
    - name: Collect release files
      run: |
        mkdir out
        cp lorie-app/build/outputs/apk/standalone/release/termux-x11-universal-release.apk out/xdesx.apk
        (cd out && sha256sum xdesx.apk > SHA256SUMS)
        rm -f "$XDESK_KEYSTORE"
    - name: Upload (manual runs)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        name: xdesx-release-${{ env.VERSION }}
        path: out/
    - name: Publish xdesx APK
      if: inputs.publish
      env:
        GH_TOKEN: ${{ secrets.XDESX_RELEASE_TOKEN }}
        RELEASE_REPO: ${{ vars.XDESX_RELEASE_REPO }}
      run: |
        [[ "$RELEASE_REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$ ]]
        [[ "${RELEASE_REPO,,}" != "n2ray/xdesk" ]]
        args=()
        if [[ "$VERSION" == *-* ]]; then args+=(--prerelease --latest=false); fi
        gh release create "v$VERSION" --repo "$RELEASE_REPO" "${args[@]}" \
          --title "xdesx $VERSION" --notes "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
          out/xdesx.apk out/SHA256SUMS
