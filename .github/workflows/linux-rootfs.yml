name: Built-in Linux image

# Builds the Ubuntu 26.04 + XFCE image XDesk's built-in Linux installs, as an artifact (not published).
on:
  workflow_dispatch:
  push:
    branches: [builtin-linux]
    paths: ['linux/**', 'lorie-app/src/main/assets/linux/**', '.github/workflows/linux-rootfs.yml']

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - uses: actions/checkout@v7
      with:
        repository: lfdevs/mesa-for-android-container
        ref: 6f90e92dfdacc4759d8e9ccb328805d0f0b4439b
        path: mesa-src
        persist-credentials: false
    - name: Build the Chrome VA driver in Ubuntu 26.04
      run: |
        docker run --rm --platform linux/arm64 -v "$PWD:/src" -w /src ubuntu:26.04 sh -ec '
          export DEBIAN_FRONTEND=noninteractive
          sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get build-dep -y mesa
          apt-get install -y --no-install-recommends git libxfixes-dev libarchive-dev glslang-tools
          git config --global --add safe.directory /src/mesa-src
          sh linux/chrome-va/build-chrome-va.sh /src/mesa-src /src/chrome-va-out
        '
    - name: Build in ubuntu:26.04
      run: |
        docker run --name xd --platform linux/arm64 -v "$PWD:/src:ro" ubuntu:26.04 sh /src/linux/build-rootfs.sh
    - name: Export
      run: |
        mkdir rootfs
        docker export xd | sudo tar -x -C rootfs
        sudo rm -f rootfs/.dockerenv
        sudo sh -c 'printf "127.0.0.1 localhost\n::1 localhost\n" > rootfs/etc/hosts; echo xdesk > rootfs/etc/hostname; : > rootfs/etc/resolv.conf'
        # Android apps cannot make hard links: each further link to a file becomes a symlink to its first one. Copies
        # would do too, but Ubuntu's coreutils (uutils) is one binary under ~100 hard-linked names: 1.1 GB as copies.
        sudo python3 - <<'PY'
        import os
        first = {}
        for d, _, names in os.walk('rootfs'):
            for n in names:
                p = os.path.join(d, n)
                st = os.lstat(p)
                if not os.path.isfile(p) or os.path.islink(p) or st.st_nlink < 2:
                    continue
                key = (st.st_dev, st.st_ino)
                if key not in first:
                    first[key] = p
                    continue
                os.unlink(p)
                os.symlink(os.path.relpath(first[key], d), p)
        print(len(first), 'hard-linked files, the rest of their names now symlinks')
        PY
        sudo tar --hard-dereference --numeric-owner -C rootfs -czf xdesk-ubuntu2604-arm64.tar.gz .
        sha256sum xdesk-ubuntu2604-arm64.tar.gz | tee xdesk-ubuntu2604-arm64.tar.gz.sha256
        ls -la xdesk-ubuntu2604-arm64.tar.gz
        sudo du -sh rootfs
    - uses: actions/upload-artifact@v7
      with:
        name: xdesk-ubuntu2604-arm64
        path: |
          xdesk-ubuntu2604-arm64.tar.gz
          xdesk-ubuntu2604-arm64.tar.gz.sha256
        compression-level: 0
        retention-days: 14
