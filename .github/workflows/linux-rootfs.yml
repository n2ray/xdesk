name: Built-in Linux image

# Builds the Ubuntu 26.04 + XFCE image XDesk's built-in Linux installs, as an artifact (not published).
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish the verified xdesx Ubuntu apps r1 image
  push:
    branches: [builtin-linux]
    paths: ['linux/**', 'lorie-app/src/main/assets/linux/**', '.github/workflows/linux-rootfs.yml']

permissions:
  contents: write

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Build in ubuntu:26.04
      run: |
        docker run -e XDESX_APPS_ONLY=1 --name xd --platform linux/arm64 -v "$PWD:/src:ro" ubuntu:26.04 sh /src/linux/build-rootfs.sh
    - name: Export
      run: |
        mkdir rootfs
        docker export xd | sudo tar -x -C rootfs
        sudo rm -f rootfs/.dockerenv
        sudo sh -c 'printf "127.0.0.1 localhost\n::1 localhost\n" > rootfs/etc/hosts; echo xdesk > rootfs/etc/hostname; : > rootfs/etc/resolv.conf'
        # Android apps cannot make hard links: each further link to a file becomes a symlink to its first one. Copies
        # would do too, but Ubuntu's coreutils (uutils) is one binary under ~100 hard-linked names: 1.1 GB as copies.
        sudo python3 - <<'PY'
        import os
        first = {}
        for d, _, names in os.walk('rootfs'):
            for n in names:
                p = os.path.join(d, n)
                st = os.lstat(p)
                if not os.path.isfile(p) or os.path.islink(p) or st.st_nlink < 2:
                    continue
                key = (st.st_dev, st.st_ino)
                if key not in first:
                    first[key] = p
                    continue
                os.unlink(p)
                os.symlink(os.path.relpath(first[key], d), p)
        print(len(first), 'hard-linked files, the rest of their names now symlinks')
        PY
        test -x rootfs/usr/bin/xterm && test ! -e rootfs/usr/bin/xfwm4 && test ! -e rootfs/usr/bin/xfce4-session
        sudo tar --hard-dereference --numeric-owner -C rootfs -czf xdesx-ubuntu-apps-arm64.tar.gz .
        sha256sum xdesx-ubuntu-apps-arm64.tar.gz | tee xdesx-ubuntu-apps-arm64.tar.gz.sha256
        ls -la xdesx-ubuntu-apps-arm64.tar.gz
        sudo du -sh rootfs
    - uses: actions/upload-artifact@v7
      with:
        name: xdesx-ubuntu-apps-arm64
        path: |
          xdesx-ubuntu-apps-arm64.tar.gz
          xdesx-ubuntu-apps-arm64.tar.gz.sha256
        compression-level: 0
        retention-days: 14
    - name: Publish xdesx Ubuntu apps r1
      if: inputs.publish && github.ref_name == 'xdesx'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sha256sum -c xdesx-ubuntu-apps-arm64.tar.gz.sha256
        gh release create xdesx-ubuntu-apps-r1 --target "$GITHUB_SHA" --prerelease \
          --title "xdesx Ubuntu 26.04 应用环境 r1" \
          --notes "xdesx 首次启用 Linux 时下载的 ARM64 应用环境。包含 xterm、Mousepad 和图形加速支持，窗口由外屏上的 xfwm4 管理。" \
          xdesx-ubuntu-apps-arm64.tar.gz xdesx-ubuntu-apps-arm64.tar.gz.sha256
