name: GLX shared presentation prototype
on:
  pull_request:
    paths:
      - 'tools/glx-present/**'
      - '.github/workflows/glx-present.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "build-tools;35.0.0" "platforms;android-35"'
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" tools/glx-present/build-display.sh build/glx 800
      - uses: actions/upload-artifact@v4
        with:
          name: glx-display-unsigned
          path: build/glx/
  ubuntu-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:26.04 sh -ec '
            export DEBIAN_FRONTEND=noninteractive
            sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
            apt-get -qq update
            apt-get -y build-dep mesa
            apt-get install -y git glslang-tools libxcb-shm0-dev libxfixes-dev libx11-dev
            tools/glx-present/build-guest.sh build/glx
          '
      - uses: actions/upload-artifact@v4
        with:
          name: glx-guest-arm64
          path: build/glx/
