<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XDesk Web">
<meta name="theme-color" content="#0b0d10">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<!-- The receiver's logo, mirrored: the short strokes white, the long one blue (Brand.dc.html) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20108%20108'%3E%3Crect%20width='108'%20height='108'%20rx='24'%20fill='%2311151C'/%3E%3Cg%20fill='none'%20stroke-width='11'%20stroke-linecap='round'%3E%3Cpath%20d='M36%2036l8.6%208.6M63.4%2063.4L72%2072'%20stroke='%23fff'/%3E%3Cpath%20d='M72%2036L36%2072'%20stroke='%233D7EF5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/xdesk.css">
<title>XDesk Web</title>
</head>
<body>
<div id="stage">
  <video id="video" muted playsinline disablepictureinpicture disableremoteplayback></video>
  <canvas id="canvas"></canvas>
</div>
<textarea id="kbd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true"></textarea>

<!-- The handle on the right edge opens the tools, as on XDesk Receiver and the Mac app -->
<div id="bar">
  <div id="tools" class="hidden">
    <button id="b-kbd" title=""><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="2"/><path d="M6 11h.01M10 11h.01M14 11h.01M18 11h.01M7 15h10"/></svg><span></span></button>
    <button id="b-back" title=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span></span></button>
    <button id="b-home" title=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg><span></span></button>
    <button id="b-overview" title="" class="hidden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span></span></button>
    <button id="b-full" title=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span></span></button>
    <button id="b-sound" title=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zM16.5 9a4 4 0 0 1 0 6"/></svg><span></span></button>
    <button id="b-quit" title=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l-2 2a3.5 3.5 0 0 1-5-5l2-2M15 9l2-2a3.5 3.5 0 0 1 5 5l-2 2M8 8L4 4M20 20l-4-4"/></svg><span></span></button>
  </div>
  <div id="handle" role="button" aria-label=""><span></span></div>
</div>
<div id="hint" class="hidden"></div>

<div id="panel">
  <div class="card">
    <svg viewBox="0 0 108 108" class="logo" role="img" aria-label="XDesk"><rect width="108" height="108" rx="24" fill="#11151C"/><g fill="none" stroke-width="11" stroke-linecap="round"><path d="M36 36l8.6 8.6M63.4 63.4L72 72" stroke="#fff"/><path d="M72 36L36 72" stroke="#3D7EF5"/></g></svg>
    <h1 id="title"></h1>
    <p id="status"></p>
    <form id="pair" class="hidden" autocomplete="off">
      <div class="codefield">
        <div id="boxes" class="boxes" aria-hidden="true"><span class="cb"></span><span class="cb"></span><span class="cb"></span><span class="cb"></span></div>
        <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off">
      </div>
      <button type="submit" id="b-pair"></button>
    </form>
    <button id="b-connect" class="hidden"></button>
    <p id="foot" class="small"></p>
    <p id="note" class="small"></p>
  </div>
</div>
<script src="/xdesk.js"></script>
</body>
</html>
