import groovy.xml.XmlSlurper
import com.android.build.api.artifact.SingleArtifact

apply plugin: 'com.android.application'
apply from: '../lorie/version.gradle'

abstract class VerifySharedUidProcess extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getManifest()

    @TaskAction
    void verify() {
        def root = new XmlSlurper(false, false).parse(manifest.get().asFile)
        def appProcess = root.application.@'android:process'.text()
        def offenders = ['activity', 'activity-alias', 'service', 'receiver', 'provider'].collectMany { type ->
            root.application."$type".findAll { (it.@'android:process'.text() ?: appProcess) != 'com.termux' }
                .collect { "$type ${it.@'android:name'}" }
        }
        if (!offenders.isEmpty())
            throw new GradleException("sharedUid components must run in process com.termux: ${offenders.join(', ')}")
    }
}

android {
    namespace 'com.termux.x11.app'
    compileSdkVersion 34
    ndkVersion termuxX11NdkVersion
    defaultConfig {
        applicationId "io.github.n2ray.xdesk.x11"
        minSdkVersion 30
        targetSdkVersion 34
        // Releases pass -PxdeskVersion=0.2.0 (from the tag): 0.2.0 becomes versionCode 200. Other builds keep the
        // upstream-style name with the commit, and a code below every release.
        versionCode xdeskVersionCode
        versionName xdeskVersionName
    }

    flavorDimensions "uid"
    productFlavors {
        standalone {
            dimension "uid"
        }
        sharedUid {
            dimension "uid"
            targetSdkVersion 28
        }
    }

    signingConfigs.debug {
        storeFile file('testkey_untrusted.jks')
        keyAlias 'alias'
        storePassword 'xrj45yWGLbsO7W0v'
        keyPassword 'xrj45yWGLbsO7W0v'
    }
    // The private release key comes from CI secrets only. The test key above is public: anything signed with it
    // could be installed over XDesk and take its paired adb key, so it must never sign a release.
    if (System.getenv('XDESK_KEYSTORE')) {
        signingConfigs.create('release') {
            storeFile file(System.getenv('XDESK_KEYSTORE'))
            storeType 'PKCS12'
            keyAlias System.getenv('XDESK_KEY_ALIAS')
            storePassword System.getenv('XDESK_KEYSTORE_PASSWORD')
            keyPassword System.getenv('XDESK_KEYSTORE_PASSWORD')
        }
    }

    buildFeatures.aidl true

    compileOptions.sourceCompatibility JavaVersion.VERSION_1_9
    compileOptions.targetCompatibility JavaVersion.VERSION_1_9
    buildTypes.debug {
        signingConfig signingConfigs.debug
        minifyEnabled true
        shrinkResources true
        proguardFiles 'proguard-rules.pro'
    }
    // Not debuggable, signed with the private key, ARM only: no phone that can run XDesk is x86
    buildTypes.release {
        signingConfig signingConfigs.findByName('release')
        minifyEnabled true
        shrinkResources true
        proguardFiles 'proguard-rules.pro'
        ndk.abiFilters 'arm64-v8a', 'armeabi-v7a'
    }
}

// Release links and instructions point at this name, it does not follow the module.
androidComponents {
    onVariants(selector().all()) { variant ->
        def name = variant.flavorName == 'standalone' ? variant.buildType : "${variant.flavorName}-${variant.buildType}"
        variant.outputs.each { output ->
            output.outputFileName.set("termux-x11-universal-${name}.apk")
        }
        if (variant.flavorName == 'sharedUid') {
            def verify = tasks.register("verify${variant.name.capitalize()}Process", VerifySharedUidProcess) {
                manifest.set(variant.artifacts.get(SingleArtifact.MERGED_MANIFEST.INSTANCE))
            }
            tasks.matching { it.name == "package${variant.name.capitalize()}" }.configureEach { dependsOn(verify) }
        }
    }
}

tasks.matching { it.name == 'assembleDebug' }.configureEach { dependsOn ':shell-loader:buildCompanionPackage' }

dependencies {
    implementation project(':lorie')
    // XDeskActivity 要用 MainActivity，它的父类 AppCompatActivity 经 preference 传递而来
    implementation "androidx.preference:preference:1.2.1"
    // Android apps on the external display: runs the input injector as the shell user
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    // The same without Shizuku: pairs with the device's own adbd. Only the hidden Conscrypt call of the pairing needs the bypass
    implementation "com.github.MuntashirAkon:libadb-android:3.1.1"
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"
}
