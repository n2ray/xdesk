//file:noinspection UnnecessaryQualifiedReference, GrDeprecatedAPIUsage

// Detect android studio sync and disable generating run/debug configuration for shell-loader
if (gradle.startParameter.taskNames.isEmpty())
    apply plugin: 'com.android.library'
else
    apply plugin: 'com.android.application'

android.namespace 'com.termux.x11.shell_loader'
android.defaultConfig.minSdkVersion 24
android.compileSdkVersion 34
android.buildTypes.debug.signingConfig null
android.buildTypes.debug.minifyEnabled true
android.buildTypes.debug.shrinkResources true
android.buildTypes.debug.proguardFiles 'proguard-rules.pro'
android.buildFeatures.buildConfig true
android.compileOptions.sourceCompatibility JavaVersion.VERSION_1_8
android.compileOptions.targetCompatibility JavaVersion.VERSION_1_8
dependencies.compileOnly project(':shell-loader:stub')

if (!gradle.startParameter.taskNames.isEmpty())
    androidComponents { onVariants(selector().all()) { outputs.forEach { it.outputFileName.set("shell-loader-debug.apk") } } }

configurations.configureEach { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib" }

// The loader checks the app it loads was signed with the same key, so it uses the release key when there is one
def signingConfig = project(':lorie-app').android.signingConfigs.findByName('release') ?: project(':lorie-app').android.signingConfigs.debug
def keyStore = java.security.KeyStore.getInstance(signingConfig.storeType ?: java.security.KeyStore.getDefaultType())
keyStore.load(new FileInputStream(signingConfig.storeFile), signingConfig.storePassword.toCharArray())

ext.targetApplicationId = "io.github.n2ray.xdesk.x11"
ext.embeddedApplicationId = "com.termux"

android.defaultConfig.buildConfigField "String", "APPLICATION_ID", "\"$targetApplicationId\""
android.defaultConfig.buildConfigField "String", "EMBEDDED_APPLICATION_ID", "\"$embeddedApplicationId\""
android.defaultConfig.buildConfigField "String", "logTag", "\"Termux:X11 loader\""
android.defaultConfig.buildConfigField "int", "SIGNATURE", String.valueOf(Arrays.hashCode(keyStore.getCertificate(signingConfig.keyAlias).getEncoded()))
android.defaultConfig.buildConfigField "String", "CLASS_ID", "\"com.termux.x11.CmdEntryPoint\""
android.defaultConfig.buildConfigField "String", "packageNotInstalledErrorText",
        """\"XDesk application is not found.\\n\" +
        \"You should choose latest release here: \\n https://github.com/n2ray/xdesk/releases\\n\" +
        \"After this you should download \\"xdesk.apk\\" and install it.\\n\""""
android.defaultConfig.buildConfigField "String", "packageSignatureMismatchErrorText",
        "\"Signature verification of target application $targetApplicationId failed.\\nPlease, reinstall the xdesk command and the XDesk app from the same release\""
android.defaultConfig.buildConfigField "String", "COMMIT", "\"" + ("git rev-parse HEAD\n".execute().getText().trim() ?: (System.getenv('CURRENT_COMMIT') ?: "NO_COMMIT")) + "\""

apply from: 'companion-package.gradle'
